[package]
name = "arb-router"
version = "0.1.0"
description = "Arbitrage router with flash loan capability"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arb_router"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# Anchor 0.32.1 to match CLI version
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token"] }
# Pin indexmap to version compatible with Rust 1.79 (Agave platform tools)
indexmap = "=2.5.0"

[dev-dependencies]
anchor-client = "0.32.1"

