[package]
name = "arb-router"
version = "0.1.0"
description = "Arbitrage router with flash loan capability"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arb_router"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# Anchor 0.30.1 compatible with Agave 2.x (Solana 2.x)
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }

[dev-dependencies]
anchor-client = "0.30.1"

