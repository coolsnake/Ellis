[package]
name = "arb-router"
version = "0.1.0"
description = "Arbitrage router with flash loan capability"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "arb_router"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# Using 0.29.0 for better compatibility with Solana platform tools Rust 1.75
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["token"] }

[dev-dependencies]
anchor-client = "0.29.0"

