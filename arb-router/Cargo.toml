[workspace]
members = [
    "programs/*"
]
resolver = "2"

# Pin dependencies to versions compatible with Rust 1.79 (Agave platform tools)
[workspace.dependencies]
indexmap = "=2.5.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

