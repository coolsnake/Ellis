[package]
name = "arb-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "fs"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
petgraph = "0.6"
futures = "0.3"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
once_cell = "1"
# Force time crate to 0.3.44 to fix Rust 1.80+ inference errors
# Adding as direct dependency forces all transitive deps to use this version
time = "0.3.44"

[profile.release]
# Maximum optimizations for production performance
opt-level = 3
# Link-time optimization for better performance (slower build, faster runtime)
lto = true
# Single codegen unit for better optimization (slower build, faster runtime)
codegen-units = 1
# Strip debug symbols to reduce binary size
strip = true

